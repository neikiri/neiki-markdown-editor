<!DOCTYPE html>
<html lang="en" data-color-mode="light">

<head>
    <meta name="description" content="Demo of Neiki's Markdown Editor, a live browser-based Markdown editor and GitHub-styled previewer.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Neiki's Markdown Editor – Live Markdown Preview">
    <meta property="og:description" content="A live browser-based Markdown editor and GitHub-styled previewer.">
    <meta property="og:url" content="https://neikiri.dev/markdown-editor/">
    <meta name="twitter:card" content="summary">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <title>Neiki's Markdown Editor</title>

    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css" id="github-md-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css" id="github-md-dark" disabled>

    <!-- Highlight.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-dark" disabled>
    <!-- Dracula syntax highlighting is defined locally in css/style.css (official palette, see https://draculatheme.com/spec) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- markdown-it + plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/markdown-it/13.0.2/markdown-it.min.js"></script>

    <!-- DOMPurify -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header id="app-header">
        <div class="header-left">
            <img src="img/icon.png" alt="Logo" class="logo-img" height="32" width="auto">
            <span class="app-title">Neiki's Markdown Editor</span>
        </div>
        <div class="header-right">
            <button id="btn-reset" class="header-btn" title="Reset editor">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10" />
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                </svg>
                <span>Reset</span>
            </button>
            <button id="btn-export" class="header-btn" title="Export as .md file">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="7 10 12 15 17 10" />
                    <line x1="12" y1="15" x2="12" y2="3" />
                </svg>
                <span>Export</span>
            </button>
            <button id="btn-theme" class="header-btn icon-only" title="Toggle dark/light mode">
                <!-- Sun icon (shown in dark mode) -->
                <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <a href="https://github.com/neikiri/neiki-markdown-editor" target="_blank" rel="noopener noreferrer" class="header-btn github-btn" title="View on GitHub">
                <svg viewBox="0 0 16 16" width="20" height="20" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
                </svg>
                <span>GitHub</span>
            </a>
        </div>
    </header>

    <!-- ===== TOOLBAR ===== -->
    <div id="toolbar">
        <button data-action="h1" title="Heading 1"><strong>H1</strong></button>
        <button data-action="h2" title="Heading 2"><strong>H2</strong></button>
        <button data-action="h3" title="Heading 3"><strong>H3</strong></button>
        <span class="toolbar-sep"></span>
        <button data-action="bold" title="Bold (Ctrl+B)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 4h8a4 4 0 0 1 0 8H6z" />
                <path d="M6 12h9a4 4 0 0 1 0 8H6z" />
            </svg></button>
        <button data-action="italic" title="Italic (Ctrl+I)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="4" x2="10" y2="4" />
                <line x1="14" y1="20" x2="5" y2="20" />
                <line x1="15" y1="4" x2="9" y2="20" />
            </svg></button>
        <button data-action="strikethrough" title="Strikethrough"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4H9a3 3 0 0 0 0 6h6a3 3 0 0 1 0 6H8" />
                <line x1="4" y1="12" x2="20" y2="12" />
            </svg></button>
        <span class="toolbar-sep"></span>
        <button data-action="inlinecode" title="Inline Code"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6" />
                <polyline points="8 6 2 12 8 18" />
            </svg></button>
        <button data-action="codeblock" title="Code Block"><span style="font-family:monospace;font-size:13px">{&nbsp;}</span></button>
        <button data-action="blockquote" title="Blockquote"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M10 8V6H4v4a4 4 0 004 4h1v-2H8a2 2 0 01-2-2V8h4zm10 0V6h-6v4a4 4 0 004 4h1v-2h-1a2 2 0 01-2-2V8h4z" />
            </svg></button>
        <span class="toolbar-sep"></span>
        <button data-action="ul" title="Unordered List"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="9" y1="6" x2="20" y2="6" />
                <line x1="9" y1="12" x2="20" y2="12" />
                <line x1="9" y1="18" x2="20" y2="18" />
                <circle cx="4" cy="6" r="1.5" fill="currentColor" />
                <circle cx="4" cy="12" r="1.5" fill="currentColor" />
                <circle cx="4" cy="18" r="1.5" fill="currentColor" />
            </svg></button>
        <button data-action="ol" title="Ordered List"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="10" y1="6" x2="20" y2="6" />
                <line x1="10" y1="12" x2="20" y2="12" />
                <line x1="10" y1="18" x2="20" y2="18" /><text x="2" y="9" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="2" y="15" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="2" y="21" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif">3</text>
            </svg></button>
        <button data-action="tasklist" title="Task List"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="5" width="6" height="6" rx="1" />
                <polyline points="4.5 8 6 9.5 8.5 6.5" />
                <line x1="12" y1="8" x2="21" y2="8" />
                <rect x="3" y="14" width="6" height="6" rx="1" />
                <line x1="12" y1="17" x2="21" y2="17" />
            </svg></button>
        <span class="toolbar-sep"></span>
        <button data-action="hr" title="Horizontal Rule">&mdash;</button>
        <button data-action="link" title="Insert Link"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
            </svg></button>
        <button data-action="image" title="Insert Image"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
            </svg></button>
        <button data-action="table" title="Insert Table"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <line x1="3" y1="9" x2="21" y2="9" />
                <line x1="3" y1="15" x2="21" y2="15" />
                <line x1="9" y1="3" x2="9" y2="21" />
                <line x1="15" y1="3" x2="15" y2="21" />
            </svg></button>
        <span class="toolbar-sep"></span>
        <button data-action="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 14 4 9 9 4" />
                <path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" />
            </svg></button>
        <button data-action="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 14 20 9 15 4" />
                <path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" />
            </svg></button>
        <span class="toolbar-sep"></span>
        <button id="btn-find" data-action="find" title="Find &amp; Replace (Ctrl+F)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg></button>
        <button id="btn-copy" data-action="copy" title="Copy Markdown">
            <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </button>
        <button id="btn-fullscreen" data-action="fullscreen" title="Toggle Fullscreen">
            <svg class="icon-expand" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 3 21 3 21 9" />
                <polyline points="9 21 3 21 3 15" />
                <line x1="21" y1="3" x2="14" y2="10" />
                <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
            <svg class="icon-compress" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <polyline points="4 14 10 14 10 20" />
                <polyline points="20 10 14 10 14 4" />
                <line x1="14" y1="10" x2="21" y2="3" />
                <line x1="3" y1="21" x2="10" y2="14" />
            </svg>
        </button>

        <span class="toolbar-spacer"></span>

        <div class="toolbar-more-wrap">
            <button id="btn-more" title="More options">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <circle cx="5" cy="12" r="2" />
                    <circle cx="12" cy="12" r="2" />
                    <circle cx="19" cy="12" r="2" />
                </svg>
            </button>
        </div>
    </div>

    <!-- More dropdown lives outside #toolbar (which clips overflow-y) so it isn't cut off -->
    <div id="more-dropdown" class="dropdown-menu">
        <div class="dropdown-label">Theme</div>
        <button class="dropdown-item" data-theme="light">
            <span class="dropdown-item-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg></span>
            <span>Light</span>
            <svg class="dropdown-item-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </button>
        <button class="dropdown-item" data-theme="dark">
            <span class="dropdown-item-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg></span>
            <span>Dark</span>
            <svg class="dropdown-item-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </button>
        <button class="dropdown-item" data-theme="dracula">
            <span class="dropdown-item-icon dracula-swatch"></span>
            <span>Dracula</span>
            <svg class="dropdown-item-check" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
            </svg>
        </button>
        <div class="dropdown-divider"></div>
        <button id="btn-help" class="dropdown-item">
            <span class="dropdown-item-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
                    <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg></span>
            <span>Help</span>
        </button>
    </div>

    <!-- ===== FIND & REPLACE PANEL ===== -->
    <div id="find-panel">
        <div class="find-row">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="find-input" placeholder="Find" autocomplete="off">
            <span id="find-count">0/0</span>
            <button id="find-prev" title="Previous match (Shift+Enter)">&#8593;</button>
            <button id="find-next" title="Next match (Enter)">&#8595;</button>
            <button id="find-close" title="Close (Esc)">&#10005;</button>
        </div>
        <div class="find-row">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9" />
                <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                <polyline points="7 23 3 19 7 15" />
                <path d="M21 13v2a4 4 0 0 1-4 4H3" />
            </svg>
            <input type="text" id="replace-input" placeholder="Replace" autocomplete="off">
            <button id="replace-one">Replace</button>
            <button id="replace-all">Replace All</button>
        </div>
    </div>

    <!-- ===== MOBILE TAB SWITCHER ===== -->
    <div id="mobile-tabs">
        <button class="mobile-tab active" data-tab="editor">Editor</button>
        <button class="mobile-tab" data-tab="preview">Preview</button>
    </div>

    <!-- ===== SPLIT SCREEN ===== -->
    <div id="split-container">
        <div id="editor-pane" class="pane">
            <textarea id="editor" spellcheck="false" placeholder="Type your Markdown here..."></textarea>
        </div>
        <div id="divider"></div>
        <div id="preview-pane" class="pane">
            <div id="preview" class="markdown-body"></div>
        </div>
    </div>

    <!-- ===== HELP MODAL ===== -->
    <div id="help-overlay" class="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
            <div class="modal-header">
                <h3 id="help-title">Help</h3>
                <button id="help-close" class="modal-close" type="button">&#10005;</button>
            </div>
            <div class="modal-body">
                <img src="img/logo.png" alt="Neiki's Markdown Editor" class="modal-logo">
                <div class="modal-info">
                    <div><strong>Author:</strong> neikiri (Jindřich Stoklasa)</div>
                    <div><strong>Version:</strong> 1.1.0</div>
                    <div><strong>GitHub:</strong> <a href="https://github.com/neikiri/neiki-markdown-editor" target="_blank" rel="noopener noreferrer">github.com/neikiri/neiki-markdown-editor</a></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
